name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read the code, nothing more: no job writes to the repository.
permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # Throwaway credentials for the job's own containers.
    env:
      TEST_DATABASE_URL: postgres://chaintrack:chaintrack@localhost:5432/chaintrack?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/1
    services:
      db:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: chaintrack
          POSTGRES_PASSWORD: chaintrack
          POSTGRES_DB: chaintrack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U chaintrack -d chaintrack"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: backend/go.mod
      - run: go vet ./...
      - name: Apply migrations
        run: >-
          docker run --rm --network host -v "$PWD/db/migrations:/migrations:ro"
          migrate/migrate:v4.18.3 -path=/migrations -database "$TEST_DATABASE_URL" up
      - name: Test with coverage
        run: |
          go test ./... -count=1 -coverpkg="$(go list ./internal/... | grep -v /bindings | paste -sd, -)" -coverprofile=coverage.out
          go tool cover -func=coverage.out | tail -1

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --prod --audit-level=high
      - run: pnpm lint
      - run: pnpm build
      - run: node --test "__tests__/**/*.test.ts"

  contracts:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
      - name: Slither (fails on a high finding)
        run: make -C .. slither
