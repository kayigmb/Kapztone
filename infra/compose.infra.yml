# Infrastructure: Postgres + automatic migrations. Combined with compose.dev.yml or compose.prod.yml.
services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chaintrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chaintrack}
      POSTGRES_DB: ${POSTGRES_DB:-chaintrack}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Applies every pending migration once, then exits.
  migrate:
    image: migrate/migrate:v4.18.3
    command:
      - -path=/migrations
      - -database=postgres://${POSTGRES_USER:-chaintrack}:${POSTGRES_PASSWORD:-chaintrack}@db:5432/${POSTGRES_DB:-chaintrack}?sslmode=disable
      - up
    volumes:
      - ../backend/db/migrations:/migrations:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
