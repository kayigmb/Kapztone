name: chaintrack_dev

# The API, relayer and chain run from the same small images as production;
# `make dev` rebuilds them (cached), so run it again after changing Go or contracts.
services:
  api:
    build: ../backend
    # Every setting comes from the repo's .env (the file `make` reads); only the
    # addresses differ from running on your machine: the other containers by name.
    env_file: ../.env
    environment: &containers
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://rustfs:9000
      CHAIN_RPC_URL: http://chain:8545
    ports:
      - "${PORT}:${PORT}"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  # Carries queued changes to the chain.
  relayer:
    build: ../backend
    entrypoint: ["/relayer"]
    env_file: ../.env
    environment: *containers
    depends_on:
      migrate:
        condition: service_completed_successfully
      chain:
        condition: service_healthy

  # A local chain with the contracts deployed, left running (contracts/Dockerfile).
  # Each start is an empty chain; the contracts land on the addresses in .env.
  chain:
    build: ../contracts
    env_file: ../.env
    ports:
      - "8545:8545"
