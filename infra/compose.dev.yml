name: chaintrack_dev

services:
  api:
    image: golang:1.26-alpine
    working_dir: /src
    # air rebuilds and restarts the API whenever a .go file changes.
    command:
      - go
      - run
      - github.com/air-verse/air@v1.67.4
      - --build.cmd=go build -o /tmp/api ./cmd/api
      - --build.bin=/tmp/api
    # Every setting comes from the repo's .env (the file `make` reads); only the
    # addresses differ from running on your machine: the other containers by name.
    env_file: ../.env
    environment: &containers
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      STORAGE_ENDPOINT: http://rustfs:9000
      CHAIN_RPC_URL: http://chain:8545
    ports:
      - "${PORT}:${PORT}"
    volumes:
      - ../backend:/src
      - go-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rustfs:
        condition: service_healthy

  # Carries queued changes to the chain. Restart it after changing relayer code.
  relayer:
    image: golang:1.26-alpine
    working_dir: /src
    command: go run ./cmd/relayer
    env_file: ../.env
    environment: *containers
    volumes:
      - ../backend:/src
      - go-cache:/go/pkg/mod
      - go-build-cache:/root/.cache/go-build
    depends_on:
      migrate:
        condition: service_completed_successfully
      chain:
        condition: service_healthy

  # A local chain with the contracts deployed, left running. A fresh chain and
  # the same admin key give the same contract addresses every time, so the
  # addresses in .env stay right across restarts (each restart is an empty chain).
  chain:
    image: node:22-alpine
    working_dir: /contracts
    env_file: ../.env
    environment:
      CI: "true"
      npm_config_store_dir: /pnpm-store
      CHAIN_RPC_URL: http://127.0.0.1:8545
    command:
      - sh
      - -c
      - |
        rm -f /tmp/deployed
        corepack enable && pnpm install --frozen-lockfile || exit 1
        pnpm hardhat node --hostname 0.0.0.0 &
        until wget -qO- --header='content-type: application/json' \
          --post-data='{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
          http://127.0.0.1:8545 >/dev/null 2>&1; do sleep 1; done
        pnpm hardhat run scripts/deploy.ts --network target && touch /tmp/deployed
        wait
    ports:
      - "8545:8545"
    volumes:
      - ../contracts:/contracts
      - chain-node-modules:/contracts/node_modules
      - pnpm-store:/pnpm-store
    healthcheck:
      test: ["CMD", "test", "-f", "/tmp/deployed"]
      interval: 5s
      retries: 60

volumes:
  go-cache:
  go-build-cache:
  chain-node-modules:
  pnpm-store:
