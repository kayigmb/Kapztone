name: chaintrack

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chaintrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-chaintrack}
      POSTGRES_DB: ${POSTGRES_DB:-chaintrack}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ../backend
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-chaintrack}:${POSTGRES_PASSWORD:-chaintrack}@db:5432/${POSTGRES_DB:-chaintrack}?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ../frontend
    environment:
      API_URL: http://api:8080
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  db-data:
