# Production: built images. Every value comes from .env; nothing has a default.
name: chaintrack_prod
services:
  db:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  api:
    build: ../backend
    restart: unless-stopped
    environment: &api-env
      PORT: ${PORT:?set PORT in .env}
      APP_ENV: ${APP_ENV:?set APP_ENV in .env}
      APP_URL: ${APP_URL:?set APP_URL in .env}
      # Addresses of the other containers; the values in .env are for running the API on your machine.
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      # The managed bucket (AWS S3 or Google Cloud Storage); see docs/operations.md.
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:?set STORAGE_ENDPOINT in .env}
      STORAGE_REGION: ${STORAGE_REGION:?set STORAGE_REGION in .env}
      STORAGE_BUCKET: ${STORAGE_BUCKET:?set STORAGE_BUCKET in .env}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:?set STORAGE_ACCESS_KEY in .env}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:?set STORAGE_SECRET_KEY in .env}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      JWT_TTL: ${JWT_TTL:?set JWT_TTL in .env}
      JWT_TTL_REMEMBER: ${JWT_TTL_REMEMBER:?set JWT_TTL_REMEMBER in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
      SUPERADMIN_EMAIL: ${SUPERADMIN_EMAIL:?set SUPERADMIN_EMAIL in .env}
      SUPERADMIN_PASSWORD: ${SUPERADMIN_PASSWORD:?set SUPERADMIN_PASSWORD in .env}
      # From a container, a chain on your machine is at host.docker.internal, not 127.0.0.1.
      CHAIN_RPC_URL: ${CHAIN_RPC_URL:?set CHAIN_RPC_URL in .env}
      CHAIN_ID: ${CHAIN_ID:?set CHAIN_ID in .env}
      CHAIN_RELAYER_KEY: ${CHAIN_RELAYER_KEY:?set CHAIN_RELAYER_KEY in .env}
      ORG_REGISTRY_ADDRESS: ${ORG_REGISTRY_ADDRESS:?set ORG_REGISTRY_ADDRESS in .env}
      FACILITY_REGISTRY_ADDRESS: ${FACILITY_REGISTRY_ADDRESS:?set FACILITY_REGISTRY_ADDRESS in .env}
      PASSPORT_REGISTRY_ADDRESS: ${PASSPORT_REGISTRY_ADDRESS:?set PASSPORT_REGISTRY_ADDRESS in .env}
      CUSTODY_MANAGER_ADDRESS: ${CUSTODY_MANAGER_ADDRESS:?set CUSTODY_MANAGER_ADDRESS in .env}
      ATTESTATION_REGISTRY_ADDRESS: ${ATTESTATION_REGISTRY_ADDRESS:?set ATTESTATION_REGISTRY_ADDRESS in .env}
      PINATA_JWT: ${PINATA_JWT:?set PINATA_JWT in .env}
      SMTP_HOST: ${SMTP_HOST:?set SMTP_HOST in .env}
      # Not needed when SMTP_HOST is none.
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
    # No published port: only the web app reaches the API (api:${PORT} on the
    # compose network). The API trusts X-Forwarded-For because of this.
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Carries queued changes to the chain. Same image and settings as the API.
  relayer:
    build: ../backend
    entrypoint: ["/relayer"]
    restart: unless-stopped
    environment: *api-env
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build: ../frontend
    restart: unless-stopped
    environment:
      API_URL: http://api:${PORT}
    ports:
      - "3000:3000"
    depends_on:
      - api

